services:
  goreecloud-ai:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      GOREEAI_OLLAMA_URL: http://host.docker.internal:11434
      GOREEAI_DATABASE_PATH: /data/ai.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ai_data:
