# Local-only development profile. Review container images and model licenses before use.
services:
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  goreecloud-ai:
    build: .
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      GOREEAI_OLLAMA_URL: http://ollama:11434
      GOREEAI_DATABASE_PATH: /data/ai.sqlite
    volumes:
      - ai_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ai_data:
  ollama_models:
