mcpSettings:
  apps: false
endpoints:
  custom:
    - name: OpenRouter
      apiKey: user_provided
      baseURL: https://openrouter.ai/api/v1
      models:
        default: [openai/gpt-4.1-mini]
        fetch: true
      dropParams: [stop]
      titleConvo: false
      summarize: false
      modelDisplayLabel: OpenRouter
    - name: Perplexity
      apiKey: user_provided
      baseURL: https://api.perplexity.ai/
      models:
        default: [sonar, sonar-pro, sonar-reasoning-pro, sonar-deep-research]
        fetch: false
      dropParams: [stop, frequency_penalty]
      titleConvo: false
      summarize: false
      modelDisplayLabel: Perplexity
mcpServers:
  context7:
    type: streamable-http
    url: https://mcp.context7.com/mcp/oauth
    requiresOAuth: true
    startup: true
    initTimeout: 15000
    timeout: 60000
    serverInstructions: false
  deepwiki:
    type: streamable-http
    url: https://mcp.deepwiki.com/mcp
    startup: true
    initTimeout: 15000
    timeout: 60000
    serverInstructions: false
  todoist:
    type: streamable-http
    url: https://ai.todoist.net/mcp
    requiresOAuth: true
    startup: true
    initTimeout: 30000
    timeout: 60000
  github:
    type: streamable-http
    url: https://api.githubcopilot.com/mcp/
    requiresOAuth: false
    apiKey:
      source: user
      authorization_type: bearer
    startup: true
    initTimeout: 30000
    timeout: 60000
  linear:
    type: streamable-http
    url: https://mcp.linear.app/mcp/readonly
    requiresOAuth: true
    startup: true
    initTimeout: 30000
    timeout: 60000
  sentry:
    type: streamable-http
    url: https://mcp.sentry.dev/mcp
    requiresOAuth: true
    startup: true
    initTimeout: 30000
    timeout: 60000
  google-drive:
    type: streamable-http
    url: https://drivemcp.googleapis.com/mcp/v1
    requiresOAuth: true
    startup: false
    # OFF until Developer Preview + OAuth + GoreeCloud-only folder policy.
    initTimeout: 30000
    timeout: 60000
  dropbox:
    type: streamable-http
    url: https://mcp.dropbox.com/mcp
    requiresOAuth: true
    startup: false
    # OFF pending Dropbox OAuth client + accepted redirect.
    initTimeout: 30000
    timeout: 60000
  remote-desktop-commander:
    type: streamable-http
    url: https://mcp.desktopcommander.app/mcp
    requiresOAuth: true
    startup: false
    # OFF pending separately approved full machine access.
    initTimeout: 30000
    timeout: 60000
# Chrome requires local consent-based pairing; no hosted remote endpoint.
