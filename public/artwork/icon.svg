<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud AI candidate icon</title>
  <desc id="desc">A luminous six-node intelligence aperture inside a rounded Glaze UI tile.</desc>
  <defs>
    <linearGradient id="tile" x1="146" y1="112" x2="878" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DD8FF"/>
      <stop offset="0.38" stop-color="#5B8FFF"/>
      <stop offset="0.72" stop-color="#6557E8"/>
      <stop offset="1" stop-color="#B65DEB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 454) rotate(90) scale(410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#D9E9FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#091225" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="355" y1="302" x2="692" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="42" flood-color="#1E2E74" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="238" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="73" y="73" width="878" height="878" rx="237" fill="url(#glow)"/>
  <path d="M159 299C226 179 356 112 500 112c166 0 312 88 391 220" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
  <path d="M183 734c88 112 201 170 336 170 142 0 263-61 341-170" fill="none" stroke="#152456" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>

  <g filter="url(#softGlow)" fill="none" stroke="url(#mark)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 310v126"/>
    <path d="M687 412 578 475"/>
    <path d="m687 614-109-63"/>
    <path d="M512 714V588"/>
    <path d="m337 614 109-63"/>
    <path d="m337 412 109 63"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="512" cy="288" r="48"/>
    <circle cx="706" cy="400" r="48"/>
    <circle cx="706" cy="624" r="48"/>
    <circle cx="512" cy="736" r="48"/>
    <circle cx="318" cy="624" r="48"/>
    <circle cx="318" cy="400" r="48"/>
  </g>

  <circle cx="512" cy="512" r="122" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.84" stroke-width="24"/>
  <circle cx="512" cy="512" r="64" fill="#FFFFFF"/>
  <circle cx="489" cy="487" r="18" fill="#D9E8FF"/>
</svg>
