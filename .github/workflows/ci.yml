name: GoreeCloud AI checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install "uv==0.13.7"
          cd server && uv sync --locked --extra dev --extra sqlcipher --python 3.12
      - name: Lint Python
        run: cd server && uv run --locked --extra dev --extra sqlcipher ruff check app tests ../tools
      - name: Verify optional SQLCipher runtime
        run: |
          cd server
          uv run --locked --extra dev --extra sqlcipher python -c "import sqlcipher3; assert sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone()[0]"
      - name: Run API tests
        run: cd server && uv run --locked --extra dev --extra sqlcipher pytest -q
      - name: Audit locked production Python dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          cd server
          uv export --locked --no-dev --extra sqlcipher --no-emit-project --format requirements-txt -o /tmp/goreecloud-ai-runtime-requirements.txt
          pip-audit -r /tmp/goreecloud-ai-runtime-requirements.txt --no-deps --disable-pip
      - name: Compile Python
        run: python -m compileall -q server/app linux
      - name: Generate lockfile CycloneDX component inventories
        run: python tools/build_sbom.py --output dist/sbom
      - name: Upload development lockfile SBOM inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-ai-lockfile-sbom
          path: dist/sbom/*.cdx.json
          retention-days: 7
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: cd web && npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and bundle
        run: cd web && npm run build
      - name: Audit web production dependencies
        run: cd web && npm audit --omit=dev --audit-level=high

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install native Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install Qt Quick
        run: python -m pip install -r linux/requirements.txt
      - name: Load QML without window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python linux/smoke.py

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform using preinstalled runner SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.4.1"
      - name: Assemble Android debug APK
        run: cd android && gradle :app:assembleDebug --no-daemon
