name: GoreeCloud AI checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install "uv==0.13.7"
          cd server && uv sync --locked --extra dev --python 3.12
      - name: Lint Python
        run: cd server && uv run --locked --extra dev ruff check app tests
      - name: Run API tests
        run: cd server && uv run --locked --extra dev pytest -q
      - name: Audit locked production Python dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          cd server
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/goreecloud-ai-runtime-requirements.txt
          pip-audit -r /tmp/goreecloud-ai-runtime-requirements.txt --no-deps --disable-pip
      - name: Compile Python
        run: python -m compileall -q server/app linux

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: cd web && npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and bundle
        run: cd web && npm run build

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install Qt Quick
        run: python -m pip install -r linux/requirements.txt
      - name: Load QML without window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python linux/smoke.py

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform using preinstalled runner SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Assemble Android debug APK
        run: cd android && gradle :app:assembleDebug --no-daemon
