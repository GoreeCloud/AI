name: GoreeCloud AI checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install "uv==0.13.7"
          cd server && uv sync --locked --extra dev --extra sqlcipher --python 3.12
      - name: Lint Python
        run: cd server && uv run --locked --extra dev --extra sqlcipher ruff check app tests ../tools
      - name: Verify optional SQLCipher runtime
        run: |
          cd server
          uv run --locked --extra dev --extra sqlcipher python -c "import sqlcipher3; assert sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone()[0]"
      - name: Run API tests
        run: cd server && uv run --locked --extra dev --extra sqlcipher pytest -q
      - name: Audit locked production Python dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          cd server
          uv export --locked --no-dev --extra sqlcipher --no-emit-project --format requirements-txt -o /tmp/goreecloud-ai-runtime-requirements.txt
          pip-audit -r /tmp/goreecloud-ai-runtime-requirements.txt --no-deps --disable-pip
      - name: Compile Python
        run: python -m compileall -q server/app linux
      - name: Generate source/lockfile CycloneDX component inventories
        run: python tools/build_sbom.py --output dist/sbom
      - name: Upload development source/lockfile SBOM inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreecloud-ai-source-inventories
          path: dist/sbom/*.cdx.json
          retention-days: 7
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked web dependencies
        run: cd web && npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and bundle
        run: cd web && npm run build
      - name: Audit web production dependencies
        run: cd web && npm audit --omit=dev --audit-level=high

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install native Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install Qt Quick
        run: python -m pip install -r linux/requirements.txt
      - name: Test native Qt SSE transport and rejection boundaries
        run: python -m unittest discover -s linux -p 'test_*.py'
      - name: Inventory installed Qt Python wheels (partial)
        run: python tools/build_sbom.py --output dist/sbom-qt --include-qt-runtime
      - name: Upload partial native Qt wheel inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreecloud-ai-installed-qt-wheels
          path: dist/sbom-qt/qt-runtime.cdx.json
          retention-days: 7
          if-no-files-found: error
      - name: Load QML without window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python linux/smoke.py

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true
      - name: Install Android SDK platform using preinstalled runner SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
      - name: Verify shared Compose source provenance and host privacy contract
        run: python tools/test_compose_source_integration.py
      - name: Test Android SSE and build debug plus release manifest
        run: cd android && gradle :app:testDebugUnitTest :app:assembleDebug :app:processReleaseMainManifest --no-daemon
