name: Validate GoreeCloud AI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Test Wardveil AI artifact security
        run: python3 scripts/test_ai_artifact_security.py

      - name: Test GoreeCloud Code repository context
        run: python3 scripts/test_code_repository_context.py

      - name: Validate Wardveil AI integration contract
        run: python3 scripts/validate_wardveil_ai_integration.py

      - name: Validate GoreeCloud Code AI integration contract
        run: python3 scripts/validate_code_ai_integration.py

      - name: Test local-only Ollama model gateway
        run: python3 scripts/test_local_model_gateway.py

      - name: Test local-only streamed model responses
        run: python3 scripts/test_local_model_streaming.py

      - name: Test private in-memory local chat sessions
        run: python3 scripts/test_local_chat_session.py

      - name: Compile Python sources
        run: python3 -m py_compile reference/ai_artifact_security.py reference/code_repository_context.py reference/repository_context_selection.py reference/local_model_gateway.py reference/local_chat_session.py scripts/ai_local.py scripts/test_local_model_gateway.py scripts/test_local_model_streaming.py scripts/test_local_chat_session.py scripts/test_ai_artifact_security.py scripts/test_code_repository_context.py scripts/validate_wardveil_ai_integration.py scripts/validate_code_ai_integration.py
